<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <title>Dijital Öğrenme Köprüsü</title>
</head>
<body>
    <main class="home-page">
        <h1>Dijital Öğrenme Köprüsü</h1>
        <p>Eğlenceli ve öğretici oyunlar</p>

        <ul class="game-list">
            <li>
                <a class="game-card" href="{{ url_for('match') }}">
                    <span class="game-card__icon" aria-hidden="true">
                        <img src="{{ url_for('static', filename='img/english_words.png') }}" alt="">
                    </span>
                    <span class="game-card__title">İngilizce Kelime Eşleştirme Oyunu</span>
                </a>
            </li>
            <li>
                <a class="game-card" href="{{ url_for('multiply') }}">
                    <span class="game-card__icon" aria-hidden="true">
                        <img src="{{ url_for('static', filename='img/multiply.png') }}" alt="">
                    </span>
                    <span class="game-card__title">Matematik Çarpım Oyunu</span>
                </a>
            </li>
            <li>
                <a class="game-card" href="{{ url_for('addition') }}">
                    <span class="game-card__icon" aria-hidden="true">
                        <img src="{{ url_for('static', filename='img/addition.png') }}" alt="">
                    </span>
                    <span class="game-card__title">Matematik Toplama & Çıkarma Oyunu</span>
                </a>
            </li>
            <li>
                <a class="game-card" href="{{ url_for('memory') }}">
                    <span class="game-card__icon" aria-hidden="true">
                        <img src="{{ url_for('static', filename='img/memory.png') }}" alt="">
                    </span>
                    <span class="game-card__title">Hafıza Kartları Oyunu</span>
                </a>
            </li>
        </ul>
    </main>


</body>
</html>
